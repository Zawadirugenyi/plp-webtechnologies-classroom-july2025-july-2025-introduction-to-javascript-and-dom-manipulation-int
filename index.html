<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Fundamentals Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>JavaScript Fundamentals Demo</h1>

    <!-- Part 1: User Input & Conditional -->
    <section id="part1">
        <h2>Part 1: Variables & Conditionals</h2>
        <input type="number" id="ageInput" placeholder="Enter your age">
        <button id="checkAgeBtn">Check Age</button>
        <p id="ageResult"></p>
    </section>

    <!-- Part 2: Functions -->
    <section id="part2">
        <h2>Part 2: Functions</h2>
        <button id="greetBtn">Greet Me</button>
        <p id="greetResult"></p>
        <button id="sumBtn">Calculate Sum 5 + 10</button>
        <p id="sumResult"></p>
    </section>

    <!-- Part 3: Loops -->
    <section id="part3">
        <h2>Part 3: Loops</h2>
        <button id="loopBtn">Show Numbers 1-5</button>
        <p id="loopResult"></p>
    </section>

    <!-- Part 4: DOM Manipulation -->
    <section id="part4">
        <h2>Part 4: DOM Interactions</h2>
        <button id="changeTextBtn">Change Text</button>
        <p id="domText">This text will change.</p>

        <button id="toggleColorBtn">Toggle Color</button>
        <p id="colorText">Watch me change color!</p>

        <button id="addElementBtn">Add New Element</button>
        <div id="elementContainer"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
